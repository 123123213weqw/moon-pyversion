# TOML 1.0 defines an integer as a signed 64-bit value, but the reference
# reader's integers are arbitrary precision Python ints, so it accepts these
# three documents. This library rejects them (see leniencies.txt).
dec_wide = 9223372036854775808
dec_wide_negative = -9223372036854775809
hex_wide = 0x8000000000000000
