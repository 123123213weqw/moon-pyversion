name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon run examples/basic --target ${{ matrix.target }}

  differential:
    # The library is written against packaging 26.3, so that release is the
    # oracle that must agree. The corpus emitter is deterministic, so the same
    # inputs are used here and in the multi-oracle matrix below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install packaging==26.3
      - name: Every backend must emit the same corpus
        run: python -B tools/target_parity.py --json parity.json
      - name: Differential comparison against packaging 26.3
        run: python -B tools/diff_packaging.py --oracle-version 26.3 --json report-26.3.json
      - name: Corpus must be byte identical across runs
        run: |
          moon run examples/diff --target js > corpus-a.tsv
          moon run examples/diff --target js > corpus-b.tsv
          cmp corpus-a.tsv corpus-b.tsv
      - name: The corpus must detect deliberate defects
        run: python -B tools/mutation_probe.py --oracle python
      - name: Prerelease and compatible-release drift against packaging < 26.3
        run: |
          python -m venv /tmp/packaging-25.0
          /tmp/packaging-25.0/bin/pip install --quiet packaging==25.0
          python -B tools/oracle_matrix.py \
            --oracle /tmp/packaging-25.0/bin/python \
            --oracle python \
            --report-dir oracle-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-reports
          path: |
            parity.json
            report-26.3.json
            oracle-reports/
          if-no-files-found: ignore
