name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon run examples/basic --target ${{ matrix.target }}
      - run: moon run examples/metadata-check --target ${{ matrix.target }}
      - run: moon run examples/resolve --target ${{ matrix.target }}
      - run: moon run examples/audit --target ${{ matrix.target }}

  differential:
    # The library is written against packaging 26.3, so that release is the
    # oracle that must agree. The corpus emitter is deterministic, so the same
    # inputs are used here and in the multi-oracle matrix below. `tomli` is
    # pinned because the TOML verdicts in the fixture come from it: it is the
    # reader that implements the three relaxations the corpus records as
    # documented divergences, and the harness prefers it over `tomllib`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install packaging==26.3 tomli==2.4.1
      - name: Every backend must emit the same corpus
        run: python -B tools/target_parity.py --json parity.json
      - name: The TOML reference reader must be the one the fixture came from
        run: python -c "import tomli; assert tomli.__version__ == '2.4.1', tomli.__version__; print('tomli', tomli.__version__)"
      - name: Every committed fixture must be what its generator produces
        # A fixture is a build product: if it was hand-edited, or committed from an
        # older generation, the corpus still runs and still reports agreement --
        # against the wrong inputs. That happened once (a hand-written stub was
        # committed in place of the generated lock corpus), so both fixtures are
        # checked here.
        #
        # `--check` regenerates in memory, formats the result the way the committed
        # file is formatted, and compares. The lock and tag fixtures can do that in
        # full, because every input they read is committed -- and the tag fixture's
        # inputs are argument tuples, so the reference cannot reach the host through
        # them (the cases that would are registered as declared divergences). The
        # metadata fixture cannot:
        # its 239 real `METADATA` documents were downloaded once and the cache is
        # deliberately not in the repository, so the PyPI half cannot be rebuilt
        # here -- `--check-cases` checks the half that can be (the curated cases
        # and the divergence list, both of which are committed). Running the full
        # metadata check needs the cache and is part of the local release check.
        run: |
          python -B tools/fetch_pylock_corpus.py --check
          python -B tools/fetch_tag_corpus.py --check
          python -B tools/fetch_metadata_corpus.py --check-cases
      - name: Differential comparison against packaging 26.3
        run: python -B tools/diff_packaging.py --oracle-version 26.3 --json report-26.3.json
      - name: Corpus must be byte identical across runs
        run: |
          moon run examples/diff --target js > corpus-a.tsv
          moon run examples/diff --target js > corpus-b.tsv
          cmp corpus-a.tsv corpus-b.tsv
      - name: Every backend must print the same scenario report
        # The two scenario examples are reports a user reads, so "the same
        # answer everywhere" is part of the claim they demonstrate. The verify
        # job above only proves that each backend runs them.
        run: |
          for target in wasm wasm-gc js native; do
            moon run examples/metadata-check --target $target > dependency-check-$target.txt
            moon run examples/resolve --target $target > candidate-resolution-$target.txt
            moon run examples/audit --target $target > package-audit-$target.txt
          done
          for report in dependency-check candidate-resolution package-audit; do
            cmp $report-wasm.txt $report-wasm-gc.txt
            cmp $report-wasm.txt $report-js.txt
            cmp $report-wasm.txt $report-native.txt
            echo "$report: identical on wasm, wasm-gc, js and native"
          done

      - name: Report effective source separately from tests and fixtures
        run: python -B tools/source_metrics.py

      - name: The corpus must detect deliberate defects
        run: python -B tools/mutation_probe.py --oracle python
      - name: Prerelease and compatible-release drift against packaging < 26.3
        run: |
          python -m venv /tmp/packaging-25.0
          /tmp/packaging-25.0/bin/pip install --quiet packaging==25.0
          python -B tools/oracle_matrix.py \
            --oracle /tmp/packaging-25.0/bin/python \
            --oracle python \
            --report-dir oracle-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-reports
          path: |
            parity.json
            report-26.3.json
            oracle-reports/
          if-no-files-found: ignore
